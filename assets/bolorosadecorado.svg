    <g fill="none" stroke="#C48A62" stroke-width="2.5" stroke-linecap="round">
      <path d="M165 64 H190"/>
      <path d="M208 64 H233"/>
      <path d="M165 100 H190"/>
      <path d="M208 100 H233"/>
