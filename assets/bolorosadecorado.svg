
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="cake-title">
  <title id="cake-title">Bolo decorado rosa e amarelo com chocolate e laço</title>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5B9"/>
      <stop offset="1" stop-color="#F3C957"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFC2D3"/>
      <stop offset="0.55" stop-color="#F486A8"/>
      <stop offset="1" stop-color="#D94E7C"/>
    </linearGradient>
    <linearGradient id="chocolate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A96745"/>
      <stop offset="0.45" stop-color="#713A29"/>
      <stop offset="1" stop-color="#482319"/>
    </linearGradient>
  </defs>

  <!-- Sombra e base -->
  <ellipse cx="200" cy="390" rx="158" ry="15" fill="#D8A5A6" opacity=".25"/>
  <ellipse cx="200" cy="366" rx="166" ry="31" fill="#F8A2B9" stroke="#C94E78" stroke-width="3"/>
  <ellipse cx="200" cy="359" rx="156" ry="25" fill="#FFE9A6" stroke="#D8A34A" stroke-width="3"/>
  <ellipse cx="200" cy="354" rx="137" ry="17" fill="#FFF8E5"/>

  <!-- Corpo do bolo -->
  <path d="M49 190 Q49 151 86 151 H314 Q351 151 351 190
           V319 Q351 348 320 350 H80 Q49 348 49 319Z"
        fill="url(#cream)" stroke="#D8A34A" stroke-width="3"/>

  <!-- Cobertura rosa com gotas -->
  <path d="M45 177 Q45 137 88 137 H312 Q355 137 355 177
           L347 222 Q341 235 333 217 L325 194
           Q318 185 310 202 L299 230 Q291 242 285 224
           L275 194 Q268 183 259 201 L248 220
           Q240 234 232 216 L221 190
           Q214 179 205 198 L195 219
           Q187 232 179 214 L168 191
           Q160 180 152 198 L142 224
           Q134 238 126 219 L116 197
           Q108 186 100 204 L89 225
           Q81 237 73 219 L64 192Z"
        fill="url(#pink)" stroke="#D94E7C" stroke-width="3" stroke-linejoin="round"/>

  <!-- Brilho da cobertura -->
  <path d="M64 167 Q72 146 98 146 H301"
        fill="none" stroke="#FFF0F2" stroke-width="5" stroke-linecap="round"/>

  <!-- Rosetas decorativas na base -->
  <g fill="url(#pink)" stroke="#D95D82" stroke-width="2">
