    <circle cx="112" cy="341" r="24"/>
    <circle cx="151" cy="346" r="23"/>
    <circle cx="200" cy="348" r="24"/>
    <circle cx="249" cy="346" r="23"/>
    <circle cx="288" cy="341" r="24"/>
    <circle cx="325" cy="326" r="23"/>
  </g>
  <g fill="none" stroke="#FFE1E8" stroke-width="4" stroke-linecap="round">
    <path d="M62 323 Q70 306 82 324"/>
    <path d="M99 338 Q107 320 119 338"/>
    <path d="M138 343 Q146 325 158 343"/>
    <path d="M187 345 Q195 326 207 345"/>
    <path d="M236 343 Q244 325 256 343"/>
    <path d="M275 338 Q283 320 295 338"/>
    <path d="M312 323 Q320 306 332 323"/>
  </g>

  <!-- Confeitos -->
  <g stroke="#DDA04C" stroke-width="1.5">
    <circle cx="83" cy="260" r="5" fill="#F486A8"/>
    <circle cx="121" cy="285" r="4" fill="#B86B37"/>
    <circle cx="164" cy="251" r="5" fill="#F486A8"/>
    <circle cx="218" cy="283" r="5" fill="#E8AD3E"/>
    <circle cx="271" cy="253" r="5" fill="#F486A8"/>
    <circle cx="315" cy="280" r="4" fill="#B86B37"/>
    <circle cx="99" cy="224" r="4" fill="#FFF0BB"/>
    <circle cx="299" cy="224" r="4" fill="#FFF0BB"/>
