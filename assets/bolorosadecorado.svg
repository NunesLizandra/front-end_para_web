    <path d="M191 153 L153 216 L190 201 L200 228 L210 158Z"
          fill="#ED7197"/>
    <path d="M209 153 L247 216 L210 201 L200 228 L190 158Z"
          fill="#F69AB4"/>
    <ellipse cx="200" cy="149" rx="15" ry="18" fill="#E96590"/>
  </g>
  <g fill="none" stroke="#FFE0E9" stroke-width="3" stroke-linecap="round">
    <path d="M187 143 Q157 115 132 123"/>
    <path d="M213 143 Q243 115 268 123"/>
    <path d="M183 166 L164 198"/>
    <path d="M217 166 L236 198"/>
  </g>

  <!-- Pequenos brilhos -->
  <g fill="#FFFFFF">
    <path d="M66 115 L70 125 L80 129 L70 133 L66 143 L62 133 L52 129 L62 125Z"/>
    <path d="M326 105 L329 112 L336 115 L329 118 L326 125 L323 118 L316 115 L323 112Z"/>
    <circle cx="100" cy="112" r="3"/>
    <circle cx="301" cy="94" r="3"/>
